[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-transcribe-de"
dynamic = ["version"]
description = "Reproducible German speech transcription for audio and video, with domain-vocabulary prompting that adapts it to any subject, built on WhisperX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Christian-Maximilian Steier" }]
keywords = [
    "whisper", "whisperx", "transcription", "speech-to-text", "german",
    "research-software", "educational-technology", "higher-education", "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
whisperx = ["whisperx>=3.1"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://github.com/HSD-ZWEK/whisper-transcribe-de"
Issues = "https://github.com/HSD-ZWEK/whisper-transcribe-de/issues"

[project.scripts]
whisper-transcribe-de = "whisper_transcribe_de.cli:main"

[tool.setuptools.dynamic]
version = { attr = "whisper_transcribe_de.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whisper_transcribe_de = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["whisperx.*", "torch", "torch.*"]
ignore_missing_imports = true
